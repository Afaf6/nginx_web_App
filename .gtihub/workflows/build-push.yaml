name: build-push
# env:username:afaftawfek
run-name: build and push docker image

on:
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:

     -name: Cloning repository
      uses: actions/checkout@v6

     -name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: afaftawfek
        password: ${{ secrets.DOCKER_CREADS }}

     -name: Build and push
      uses: docker/build-push-action@v7
      with:
          context: .
          push: true
          tags: afaftawfek/nginx-app:v1